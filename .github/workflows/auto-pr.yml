name: Auto PR

on:
  push:
    branches:
      - primness_dev01

permissions:
  contents: read
  pull-requests: write

jobs:
  open-or-update-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if an open PR already exists from this branch
          EXISTING=$(gh pr list --head primness_dev01 --base main --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --base main \
              --head primness_dev01 \
              --title "dev: updates from primness_dev01" \
              --body "Automated pull request opened from the permanent development branch.

- All work occurs on \`primness_dev01\`.
- The repository owner reviews, approves, and merges.
- Direct commits to \`main\` remain blocked.

This PR was created by the auto-PR workflow so that authorship is not the repository owner."
          else
            echo "PR #$EXISTING already open; no action needed."
          fi
