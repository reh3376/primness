name: Auto PR

on:
  push:
    branches:
      - primness_dev01

permissions:
  contents: read
  pull-requests: write

jobs:
  open-or-update-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open or update PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: primness_dev01
          base: main
          title: "dev: updates from primness_dev01"
          body: |
            Automated pull request opened from the permanent development branch.

            - All work occurs on `primness_dev01`.
            - The repository owner reviews, approves, and merges.
            - Direct commits to `main` remain blocked.

            This PR was created by the auto-PR workflow so that authorship is not the repository owner.
          commit-message: "chore: auto-PR update"
          delete-branch: false
