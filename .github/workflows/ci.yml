name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - primness_dev01

permissions:
  contents: read

jobs:
  rust:
    name: Rust check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test --all-targets
