[workspace]
members = [".", "bench"]
resolver = "2"

[package]
name = "primness"
version = "0.1.0"
edition = "2021"
description = "Primness: measurement harness and experimental kernels for Obstacle D / D1 (polynomial value smoothness)"
license = "MIT OR Apache-2.0"

[dependencies]
# Multiprecision and number-theory primitives (examples; exact versions to be pinned after measurement)
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postgres = { version = "0.19", default-features = false, features = ["with-serde_json-1"] }
jsonschema = "0.29"
# Optional: rust-mp or similar for advanced poly arithmetic once the first protocol is running

[lib]
path = "src/lib.rs"

[[bin]]
name = "d1-measure"
path = "src/bin/d1_measure.rs"

[[bin]]
name = "d1_generate_instances"
path = "src/bin/d1_generate_instances.rs"

[profile.release]
lto = true
codegen-units = 1
