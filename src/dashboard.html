<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primness bench</title>
<style>
  :root {
    --ink: #1c2430;
    --paper: #d6deea;
    --dim: #8aa0b4;
    --gold: #f2c14e;
    --blue: #6ea8c9;
    --mesh: #243140;
    --line: #3a4a5c;
    --focus: #f2c14e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--paper); }
  body {
    font-family: "Avenir Next", "Futura", "Trebuchet MS", sans-serif;
    font-weight: 400;
    line-height: 1.45;
  }
  main {
    max-width: 920px;
    margin: 0;
    padding: 28px 32px 72px;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  h1 {
    margin: 0;
    font-family: Futura, "Avenir Next Condensed", "Avenir Next", sans-serif;
    font-weight: 500;
    font-size: 2.4rem;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .state {
    font-variant-numeric: tabular-nums;
    color: var(--dim);
  }
  .state.collecting { color: var(--gold); }
  .reading {
    margin: 22px 0 8px;
    font-size: 1.35rem;
    line-height: 1.3;
    max-width: 38rem;
  }
  .reading strong { font-weight: 600; }
  .scale {
    margin: 0 0 18px;
    color: var(--dim);
    max-width: 38rem;
  }
  .strip-wrap { background: var(--mesh); margin: 0 -32px; padding: 16px 32px 8px; }
  canvas { display: block; width: 100%; }
  #strip { height: 88px; }
  #chart { height: 220px; margin-top: 22px; }
  .runs { margin: 18px 0 0; }
  label { color: var(--dim); }
  select {
    margin-left: 8px;
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--line);
    border-radius: 0;
    font: inherit;
    padding: 4px 8px;
  }
  select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 22px;
    font-variant-numeric: tabular-nums;
  }
  th, td { text-align: left; padding: 7px 10px 7px 0; vertical-align: baseline; }
  th { color: var(--dim); font-weight: 500; }
  td { border-top: 1px solid var(--line); }
  code {
    font-family: "SF Mono", "ui-monospace", Menlo, monospace;
    font-size: 0.92rem;
    color: var(--gold);
  }
  .empty .reading { margin-top: 28px; }
  @media (max-width: 640px) {
    main { padding: 20px 16px 48px; }
    .strip-wrap { margin: 0 -16px; padding: 12px 16px 8px; }
    h1 { font-size: 1.8rem; }
    table { font-size: 0.92rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Primness bench</h1>
    <p class="state" id="state">Idle</p>
  </header>
  <p class="reading" id="reading">No measurements yet.</p>
  <p class="scale" id="scale">Start a harness from the repo root. This page reads the files it writes.</p>
  <div class="strip-wrap">
    <canvas id="strip" aria-label="Recent polynomial values, gold where the value was smooth"></canvas>
  </div>
  <canvas id="chart" aria-label="Density and evaluation rate across the run"></canvas>
  <div class="runs">
    <label for="run">Run <select id="run"></select></label>
  </div>
  <table>
    <thead>
      <tr>
        <th>Bound</th>
        <th>Evaluated</th>
        <th>Smooth</th>
        <th>Density</th>
        <th>Chunk rate</th>
        <th>Elapsed</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
const stateEl = document.getElementById("state");
const readingEl = document.getElementById("reading");
const scaleEl = document.getElementById("scale");
const strip = document.getElementById("strip");
const chart = document.getElementById("chart");
const runSelect = document.getElementById("run");
const rows = document.getElementById("rows");
let chosen = null;
let snapshot = { runs: [] };

function fmt(n) {
  return new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 }).format(n);
}
function fmtRate(n) {
  if (!Number.isFinite(n)) return "0";
  return new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 }).format(n);
}
function fmtDensity(n) {
  return new Intl.NumberFormat("en-US", { minimumFractionDigits: 3, maximumFractionDigits: 3 }).format(n);
}
function elapsed(ms) {
  if (ms < 1000) return ms + " ms";
  return (ms / 1000).toFixed(1) + " s";
}

function paintStrip(residues) {
  const dpr = window.devicePixelRatio || 1;
  const width = strip.clientWidth;
  const height = strip.clientHeight;
  strip.width = Math.max(1, Math.floor(width * dpr));
  strip.height = Math.max(1, Math.floor(height * dpr));
  const ctx = strip.getContext("2d");
  ctx.clearRect(0, 0, strip.width, strip.height);
  const cells = residues || "";
  const n = Math.max(cells.length, 48);
  const gap = 3 * dpr;
  const cw = Math.max(2, (strip.width - gap * (n + 1)) / n);
  const ch = 36 * dpr;
  const y = (strip.height - ch) / 2;
  for (let i = 0; i < n; i++) {
    const bit = i < cells.length ? cells[i] : "";
    ctx.fillStyle = bit === "1" ? "#f2c14e" : bit === "0" ? "#6ea8c9" : "#15202b";
    ctx.fillRect(gap + i * (cw + gap), y, cw, ch);
  }
}

function paintChart(samples) {
  const dpr = window.devicePixelRatio || 1;
  chart.width = Math.max(1, Math.floor(chart.clientWidth * dpr));
  chart.height = Math.max(1, Math.floor(chart.clientHeight * dpr));
  const ctx = chart.getContext("2d");
  const w = chart.width;
  const h = chart.height;
  ctx.clearRect(0, 0, w, h);
  const padL = 8 * dpr;
  const padR = 8 * dpr;
  const padT = 12 * dpr;
  const padB = 18 * dpr;
  ctx.strokeStyle = "#3a4a5c";
  ctx.lineWidth = dpr;
  for (let i = 0; i <= 4; i++) {
    const y = padT + ((h - padT - padB) * i) / 4;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(w - padR, y);
    ctx.stroke();
  }
  if (!samples.length) return;
  const maxRate = Math.max(...samples.map(s => s.rate_per_s), 1);
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;
  function x(i) {
    if (samples.length === 1) return padL + plotW / 2;
    return padL + (plotW * i) / (samples.length - 1);
  }
  function line(color, values) {
    ctx.beginPath();
    values.forEach((v, i) => {
      const y = padT + plotH * (1 - v);
      if (i === 0) ctx.moveTo(x(i), y);
      else ctx.lineTo(x(i), y);
    });
    ctx.strokeStyle = color;
    ctx.lineWidth = 2 * dpr;
    ctx.stroke();
  }
  line("#f2c14e", samples.map(s => Math.min(1, Math.max(0, s.density))));
  line("#6ea8c9", samples.map(s => Math.min(1, s.rate_per_s / maxRate)));
}

function render() {
  const runs = snapshot.runs || [];
  const previous = runSelect.value;
  runSelect.replaceChildren();
  if (!runs.length) {
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "None yet";
    runSelect.append(opt);
    stateEl.textContent = "Idle";
    stateEl.className = "state";
    readingEl.textContent = "No measurements yet.";
    scaleEl.innerHTML = "From the repo root, run <code>cargo run --bin d1-measure -- --region 80 examples/demo.poly</code>";
    rows.replaceChildren();
    paintStrip("");
    paintChart([]);
    return;
  }
  runs.forEach(run => {
    const opt = document.createElement("option");
    opt.value = run.run_id;
    opt.textContent = run.source + " · " + run.instance;
    runSelect.append(opt);
  });
  const stillThere = runs.some(run => run.run_id === previous);
  const id = stillThere ? previous : (chosen && runs.some(r => r.run_id === chosen) ? chosen : runs[0].run_id);
  runSelect.value = id;
  chosen = id;
  const run = runs.find(r => r.run_id === id) || runs[0];
  const age = Date.now() - run.last_ms;
  const live = run.last_kind !== "finish" && age < 4000;
  stateEl.textContent = live ? "Collecting" : "Finished";
  stateEl.className = live ? "state collecting" : "state";
  const density = run.evaluated ? run.smooth / run.evaluated : 0;
  readingEl.textContent = fmtRate(run.rate_per_s) + " values a second across this run. " + fmt(run.smooth) + " of " + fmt(run.evaluated) + " are smooth at bound " + fmt(run.b) + ".";
  const scaleText = run.scale === "full"
    ? "Full-size run on " + run.instance + "."
    : "Scaled-down " + run.scale + " run on " + run.instance + ". These figures are not the 40–80 digit claim.";
  scaleEl.textContent = scaleText + " Elapsed " + elapsed(run.elapsed_ms) + ". Density " + fmtDensity(density) + ".";
  paintStrip(run.residues || "");
  paintChart(run.samples || []);
  rows.replaceChildren();
  const byBound = [];
  (run.samples || []).forEach(sample => {
    const prev = byBound[byBound.length - 1];
    if (prev && prev.b === sample.b) byBound[byBound.length - 1] = sample;
    else byBound.push(sample);
  });
  byBound.slice().reverse().forEach(sample => {
    const tr = document.createElement("tr");
    [fmt(sample.b), fmt(sample.evaluated), fmt(sample.smooth), fmtDensity(sample.density), fmtRate(sample.rate_per_s) + "/s", elapsed(sample.elapsed_ms)]
      .forEach(text => {
        const td = document.createElement("td");
        td.textContent = text;
        tr.append(td);
      });
    rows.append(tr);
  });
}

runSelect.addEventListener("change", () => {
  chosen = runSelect.value;
  render();
});
window.addEventListener("resize", () => render());

async function poll() {
  try {
    const res = await fetch("/api/snapshot", { cache: "no-store" });
    snapshot = await res.json();
  } catch (err) {
    stateEl.textContent = "Bench unreachable";
    stateEl.className = "state";
  }
  render();
}
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
