[package]
name = "primness-bench"
version = "0.1.0"
edition = "2021"
description = "Leptos server-rendered measurement bench"
license = "MIT OR Apache-2.0"

[[bin]]
name = "primness-dashboard"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8.23", default-features = false, features = ["ssr"] }
primness = { path = ".." }
serde_json = "1"
